<!-- Supabase → Authentication → Emails → Templates → "Confirm signup"
     Subject: Confirm your Chamber account -->
<div style="background:#0a0a0a;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:32px;">
    <div style="font-size:20px;font-weight:700;letter-spacing:4px;color:#e8651a;text-align:center;">THE CHAMBER</div>
    <h1 style="font-size:18px;color:#f5f5f5;margin:28px 0 12px;">Confirm your email</h1>
    <p style="font-size:14px;line-height:1.6;color:#bbbbbb;margin:0 0 24px;">
      Welcome to The Chamber. Confirm this is your email to finish setting up your account.
    </p>
    <p style="text-align:center;margin:0 0 24px;">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/dashboard"
         style="display:inline-block;background:#e8651a;color:#000000;font-weight:700;font-size:15px;text-decoration:none;padding:12px 28px;border-radius:8px;">
        Confirm my email
      </a>
    </p>
    <p style="font-size:12px;line-height:1.6;color:#888888;margin:0;">
      Didn't sign up? You can ignore this email.
    </p>
  </div>
  <p style="text-align:center;font-size:11px;color:#555555;margin:16px 0 0;">The Chamber · the-chamber.app</p>
</div>
